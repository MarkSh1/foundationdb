---
name: Build

on:
  push:
    branches: ["ow-fork-*"]
    tags: ["*-*ow"]

jobs:
  calc_ver:
    # calculate versions from git tags
    runs-on: ubuntu-latest
    outputs:
      project_ver: ${{steps.vers.outputs.project_ver}}
      build_ver: ${{steps.vers.outputs.build_ver}}
      full_ver: ${{steps.vers.outputs.full_ver}}
      release_flag: ${{steps.vers.outputs.release_flag}}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Calculate versions
        id: vers
        shell: bash
        run: ${{github.workspace}}/build-scripts/for-github/calc-version-from-git.bash

  build:
    needs: [calc_ver]
    env:
      # There are not enough free 19 Gb mounted in "/" to build and create rpm and deb packages. 
      # So, we use /mnt/bld which is mounted to a bigger space. In /mnt there is 66 Gb free space in github action server.
      BLD_DIR: /mnt/bld


    strategy:
      matrix:
        include:
          - run_on: ubuntu-latest
            for: linux
            prepare: "debian-based"
            build_on: linux
            parallel: 5
            image: foundationdb-build:8.0.0-0.ow.build
            owner: ${GITHUB_REPOSITORY_OWNER@L}
    runs-on: ${{ matrix.run_on }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Set building repo
        run: |
          echo "use_image=ghcr.io/${{matrix.owner}}/${{matrix.image}}" >> "$GITHUB_ENV"

      - name: Build
        run: |
          sudo mkdir -p ${{ env.BLD_DIR }}
          sudo chmod 777 ${{ env.BLD_DIR }}

          echo "=== Disk space before build ==="
          df -h

          podman run --rm \
            --name build \
            --mount=type=tmpfs,dst=/tmp \
            --mount=type=tmpfs,dst=/var/tmp \
            --security-opt label=disable \
            --mount=type=bind,src=${{github.workspace}},dst=/home/runner/src,readonly \
            --mount=type=bind,src=${{ env.BLD_DIR }},dst=/home/runner/bld \
            $use_image \
            /home/runner/src/build-scripts/for-${{ matrix.for }}/build-on-${{ matrix.build_on }}.bash \
            ${{needs.calc_ver.outputs.project_ver}} \
            ${{needs.calc_ver.outputs.build_ver}} \
            ${{needs.calc_ver.outputs.release_flag}} \
            ${{ matrix.parallel }}

          echo "=== Disk space after building and creating packages ==="
          df -h

      # - name: Minimal tests
      #  working-directory: ${{ env.BLD_DIR }}
      #  shell: bash
      #  run: ctest --output-on-failure -V

      - name: Upload result
        uses: nanoufo/action-upload-artifacts-and-release-assets@v2
        with:
          path: |
            ${{ env.BLD_DIR }}/linux/packages/*${{needs.calc_ver.outputs.full_ver}}*
          if-no-files-found: error

  tests:
    needs: [calc_ver, build]
    uses: ./.github/workflows/run-tests.yml
    with:
      full_ver: ${{needs.calc_ver.outputs.full_ver}}
      build_run_id: ${{ github.run_id }}
    secrets: inherit
